apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ehealth-alert-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:

    - name: pod-health
      interval: 30s
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[5m]) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted more than once in 5 minutes."

        - alert: PodNotReady
          expr: kube_pod_status_ready{condition="true"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for 5 minutes."

    - name: resource-usage
      interval: 60s
      rules:
        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (namespace, pod)
            / sum(kube_pod_container_resource_limits{resource="cpu"}) by (namespace, pod) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage in {{ $labels.pod }}"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} CPU usage is above 85% for 10 minutes."

        - alert: HighMemoryUsage
          expr: |
            sum(container_memory_working_set_bytes{container!=""}) by (namespace, pod)
            / sum(kube_pod_container_resource_limits{resource="memory"}) by (namespace, pod) > 0.90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage in {{ $labels.pod }}"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} memory usage is above 90% for 10 minutes."

    - name: error-rate
      interval: 30s
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
            / sum(rate(http_requests_total[5m])) by (service) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate on {{ $labels.service }}"
            description: "Service {{ $labels.service }} has more than 5% HTTP 5xx error rate for 5 minutes."

    - name: node-health
      interval: 60s
      rules:
        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} has disk pressure"
            description: "Node {{ $labels.node }} has disk pressure. Free up space immediately."

        - alert: NodeHighLoad
          expr: node_load15 / count without(cpu, mode)(node_cpu_seconds_total{mode="idle"}) > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} load is high"
            description: "Node {{ $labels.instance }} 15-minute load average is above 80% for 15 minutes."
